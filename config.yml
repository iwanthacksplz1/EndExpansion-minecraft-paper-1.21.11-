# Structures are generated in newly generated End chunks.
# Chances are checked once per chunk. 0.04 = about 4% of eligible chunks.
structures:
  enabled: true
  ruins:
    enabled: true
    chance: 0.035
  void-towers:
    enabled: true
    chance: 0.012
  dungeons:
    enabled: true
    chance: 0.025
  broken-bridges:
    enabled: true
    chance: 0.018
  end-temples:
    enabled: true
    chance: 0.008

loot:
  # Vanilla loot tables keep rewards consistent with Minecraft.
  ruins: minecraft:chests/end_city_treasure
  void-towers: minecraft:chests/end_city_treasure
  dungeons: minecraft:chests/simple_dungeon
  broken-bridges: minecraft:chests/end_city_treasure
  end-temples: minecraft:chests/end_city_treasure

name: EndExpansion
version: 1.0.0
main: com.example.endexpansion.EndExpansionPlugin
api-version: '1.21'
description: Adds exploratory structures to the End.
commands:
  endexpansion:
    description: Find generated EndExpansion structures.
    usage: /endexpansion find <structure|all>
    permission: endexpansion.admin
permissions:
  endexpansion.admin:
    description: Allows use of EndExpansion admin commands.
    default: op
